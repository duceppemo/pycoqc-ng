<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372"
     role="img" aria-label="Converter pipeline: a lister process queues the input files, several parser processes turn each file into rows, and a writer process puts the rows in file order and writes the summary; the writer's report and any worker's error go back to the calling process">
  <title>pycoqc-ng converter pipeline</title>
  <style>
    .card     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .card-in  { stroke: #94a3b8; }
    .card-proc{ fill: #f8fafc; stroke: #1d6fb8; }
    .card-out { stroke: #2f8f5b; }
    .core     { fill: #1d6fb8; stroke: none; }
    .name     { font-family: "DejaVu Sans Mono", "Menlo", monospace; font-size: 15px; fill: #334155; }
    .note     { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .note-ok  { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #2f8f5b; }
    .corename { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #ffffff; }
    .corenote { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #cfe3f7; }
    .head     { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; font-weight: 700;
                fill: #94a3b8; letter-spacing: 1.2px; }
    .wire     { fill: none; stroke: #94a3b8; stroke-width: 2; }
    .wire-ok  { fill: none; stroke: #2f8f5b; stroke-width: 2; }
    .wire-err { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/></marker>
    <marker id="tip-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2f8f5b"/></marker>
  </defs>

  <text class="head" x="22"  y="30">INPUT</text>
  <text class="head" x="242" y="30">WORKER PROCESSES</text>
  <text class="head" x="862" y="30">OUTPUT</text>

  <!-- Input directory -->
  <rect class="card card-in" x="20" y="92" width="180" height="60" rx="9"/>
  <text class="name" x="36" y="117">input directory</text>
  <text class="note" x="36" y="137">fastq · bam · pod5 · fast5</text>

  <!-- Lister: one process, lists the files in order -->
  <rect class="card card-proc" x="240" y="92" width="150" height="60" rx="9"/>
  <text class="name" x="315" y="117" text-anchor="middle">lister</text>
  <text class="note" x="315" y="137" text-anchor="middle">numbers the files</text>

  <!-- Parsers: threads - 2 processes, each turning a file into rows -->
  <rect class="card card-proc" x="450" y="48"  width="170" height="48" rx="9"/>
  <text class="name" x="535" y="68"  text-anchor="middle">parser 1</text>
  <text class="note" x="535" y="86"  text-anchor="middle">file → one row per read</text>
  <rect class="card card-proc" x="450" y="106" width="170" height="48" rx="9"/>
  <text class="name" x="535" y="126" text-anchor="middle">parser 2</text>
  <text class="note" x="535" y="144" text-anchor="middle">file → one row per read</text>
  <rect class="card card-proc" x="450" y="164" width="170" height="48" rx="9"/>
  <text class="name" x="535" y="184" text-anchor="middle">parser N</text>
  <text class="note" x="535" y="202" text-anchor="middle">N = threads − 2</text>

  <!-- Writer: one process, orders and writes the rows -->
  <rect class="card card-proc" x="680" y="92" width="150" height="60" rx="9"/>
  <text class="name" x="755" y="117" text-anchor="middle">writer</text>
  <text class="note" x="755" y="137" text-anchor="middle">rows in file order</text>

  <!-- Output -->
  <rect class="card card-out" x="860" y="92" width="120" height="60" rx="9"/>
  <text class="name" x="920" y="117" text-anchor="middle">summary</text>
  <text class="note" x="920" y="137" text-anchor="middle">one .txt file</text>

  <g class="wire" marker-end="url(#tip)">
    <path d="M 204 122 L 236 122"/>
    <path d="M 394 122 C 420 122, 420 72,  446 72"/>
    <path d="M 394 122 L 446 130"/>
    <path d="M 394 122 C 420 122, 420 188, 446 188"/>
    <path d="M 624 72  C 650 72,  650 122, 676 122"/>
    <path d="M 624 130 L 676 122"/>
    <path d="M 624 188 C 650 188, 650 122, 676 122"/>
  </g>
  <g class="wire-ok" marker-end="url(#tip-ok)">
    <path d="M 834 122 L 856 122"/>
  </g>

  <text class="name" x="420" y="62" text-anchor="middle" style="font-size:12.5px">in_q</text>
  <text class="name" x="650" y="62" text-anchor="middle" style="font-size:12.5px">out_q</text>

  <!-- What goes back: the writer's report, or any worker's error -->
  <g class="wire-ok" marker-end="url(#tip-ok)">
    <path d="M 755 156 C 755 250, 740 290, 704 298"/>
  </g>
  <text class="note-ok" x="764" y="262">report (counts, duplicates,</text>
  <text class="note-ok" x="764" y="278">warnings) or error</text>

  <g class="wire-err" marker-end="url(#tip)">
    <path d="M 315 156 C 315 250, 300 282, 296 290"/>
    <path d="M 535 216 L 535 262"/>
  </g>
  <text class="note" x="304" y="226" text-anchor="end">errors</text>
  <text class="note" x="545" y="244">errors</text>

  <!-- The calling process -->
  <rect class="core" x="300" y="268" width="400" height="64" rx="12"/>
  <text class="corename" x="500" y="296" text-anchor="middle">your process</text>
  <text class="corenote" x="500" y="317" text-anchor="middle">starts the workers, waits, then logs the report or raises the error</text>

  <text class="note" x="500" y="360" text-anchor="middle">Workers start from a fork server preloaded with pycoQC on Linux, and by spawn on macOS and Windows.</text>
</svg>
