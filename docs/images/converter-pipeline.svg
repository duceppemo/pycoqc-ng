<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420"
     role="img" aria-label="Converter pipeline: a lister process queues the input files, several parser processes turn each file into rows, and a writer process puts the rows in file order and writes the summary; each worker reports to the calling process on a pipe of its own, the writer with its report and any worker with its error">
  <title>pycoqc-ng converter pipeline</title>
  <style>
    .card     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .card-in  { stroke: #94a3b8; }
    .card-proc{ fill: #f8fafc; stroke: #1d6fb8; }
    .card-out { stroke: #2f8f5b; }
    .core     { fill: #1d6fb8; stroke: none; }
    .name     { font-family: "DejaVu Sans Mono", "Menlo", monospace; font-size: 15px; fill: #334155; }
    .queue    { font-family: "DejaVu Sans Mono", "Menlo", monospace; font-size: 12.5px; fill: #64748b; }
    .note     { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .note-ok  { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #2f8f5b; }
    .corename { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #ffffff; }
    .corenote { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #cfe3f7; }
    .head     { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; font-weight: 700;
                fill: #94a3b8; letter-spacing: 1.2px; }
    .wire     { fill: none; stroke: #94a3b8; stroke-width: 2; }
    .wire-ok  { fill: none; stroke: #2f8f5b; stroke-width: 2; }
    .wire-err { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/></marker>
    <marker id="tip-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2f8f5b"/></marker>
  </defs>

  <text class="head" x="20"  y="30">INPUT</text>
  <text class="head" x="230" y="30">WORKER PROCESSES</text>
  <text class="head" x="850" y="30">OUTPUT</text>

  <!-- Input directory -->
  <rect class="card card-in" x="20" y="120" width="170" height="60" rx="9"/>
  <text class="name" x="105" y="145" text-anchor="middle">input directory</text>
  <text class="note" x="105" y="165" text-anchor="middle">fastq · bam · pod5 · fast5</text>

  <!-- Lister: one process, lists the files in order -->
  <rect class="card card-proc" x="230" y="120" width="140" height="60" rx="9"/>
  <text class="name" x="300" y="145" text-anchor="middle">lister</text>
  <text class="note" x="300" y="165" text-anchor="middle">numbers the files</text>

  <!-- Parsers: threads - 2 processes, each turning a file into rows -->
  <rect class="card card-proc" x="430" y="56"  width="170" height="50" rx="9"/>
  <text class="name" x="515" y="77"  text-anchor="middle">parser 1</text>
  <text class="note" x="515" y="95"  text-anchor="middle">file → one row per read</text>
  <rect class="card card-proc" x="430" y="125" width="170" height="50" rx="9"/>
  <text class="name" x="515" y="146" text-anchor="middle">parser 2</text>
  <text class="note" x="515" y="164" text-anchor="middle">file → one row per read</text>
  <rect class="card card-proc" x="430" y="194" width="170" height="50" rx="9"/>
  <text class="name" x="515" y="215" text-anchor="middle">parser N</text>
  <text class="note" x="515" y="233" text-anchor="middle">N = threads − 2</text>

  <!-- Writer: one process, orders and writes the rows -->
  <rect class="card card-proc" x="660" y="120" width="140" height="60" rx="9"/>
  <text class="name" x="730" y="145" text-anchor="middle">writer</text>
  <text class="note" x="730" y="165" text-anchor="middle">rows in file order</text>

  <!-- Output -->
  <rect class="card card-out" x="850" y="120" width="130" height="60" rx="9"/>
  <text class="name" x="915" y="145" text-anchor="middle">summary</text>
  <text class="note" x="915" y="165" text-anchor="middle">tab separated</text>

  <!-- input -> lister -->
  <path class="wire" d="M 190 150 L 226 150" marker-end="url(#tip)"/>

  <!-- lister -> in_q -> each parser: a bar, then one arrow per parser -->
  <text class="queue" x="400" y="48" text-anchor="middle">in_q</text>
  <path class="wire" d="M 370 150 L 400 150"/>
  <path class="wire" d="M 400 81 L 400 219"/>
  <path class="wire" d="M 400 81  L 426 81"  marker-end="url(#tip)"/>
  <path class="wire" d="M 400 150 L 426 150" marker-end="url(#tip)"/>
  <path class="wire" d="M 400 219 L 426 219" marker-end="url(#tip)"/>

  <!-- each parser -> out_q -> writer: a bar, then one arrow -->
  <text class="queue" x="630" y="48" text-anchor="middle">out_q</text>
  <path class="wire" d="M 600 81  L 630 81"/>
  <path class="wire" d="M 600 150 L 630 150"/>
  <path class="wire" d="M 600 219 L 630 219"/>
  <path class="wire" d="M 630 81 L 630 219"/>
  <path class="wire" d="M 630 150 L 656 150" marker-end="url(#tip)"/>

  <!-- writer -> summary -->
  <path class="wire-ok" d="M 800 150 L 846 150" marker-end="url(#tip-ok)"/>

  <!-- Each worker reports on a pipe of its own, straight down -->
  <path class="wire-err" d="M 300 180 L 300 316" marker-end="url(#tip)"/>
  <text class="note" x="308" y="272">errors</text>
  <path class="wire-err" d="M 515 244 L 515 316" marker-end="url(#tip)"/>
  <text class="note" x="523" y="272">errors</text>
  <path class="wire-ok" d="M 730 180 L 730 316" marker-end="url(#tip-ok)"/>
  <text class="note-ok" x="738" y="264">report (counts, duplicates,</text>
  <text class="note-ok" x="738" y="280">warnings) or error</text>

  <!-- The calling process -->
  <rect class="core" x="230" y="320" width="570" height="62" rx="12"/>
  <text class="corename" x="515" y="347" text-anchor="middle">your process</text>
  <text class="corenote" x="515" y="368" text-anchor="middle">hears from each worker, then moves the summary into place or raises the error</text>

  <text class="note" x="500" y="408" text-anchor="middle">Workers start from a fork server preloaded with pycoQC on Linux, and by spawn on macOS and Windows.</text>
</svg>
