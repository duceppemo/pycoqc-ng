<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584" width="1000" height="584"
     role="img" aria-label="Input formats: a basecaller sequencing summary is read directly, while FASTQ, unaligned BAM and basecalled FAST5 are converted into one; POD5 and signal-only FAST5 hold no basecalls, so they give a shorter report about the run itself">
  <title>pycoqc-ng input formats</title>
  <style>
    /* One colour per kind of input: a ready summary, basecalled reads, raw signal. */
    .band-sum { fill: #eefaf3; }
    .band-bc  { fill: #f3f0fd; }
    .band-raw { fill: #fff7e3; }
    .cat      { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .cat-sum  { fill: #1f6b43; }
    .cat-bc   { fill: #5b3fae; }
    .cat-raw  { fill: #8a6508; }
    .card     { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .accent   { fill: none; stroke-width: 4; stroke-linecap: round; }
    .pill     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .pill-none{ fill: none; stroke: #8cc7a6; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .out-sum  { fill: #f4fbf7; stroke: #2f8f5b; stroke-width: 2; }
    .out-raw  { fill: #fffbeb; stroke: #d9a406; stroke-width: 2; }
    .core     { fill: #1d6fb8; stroke: none; }
    .name     { font-family: "DejaVu Sans Mono", "Menlo", monospace; font-size: 13.5px; fill: #334155; }
    .label    { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1f6b43; }
    .label-raw{ font-family: "DejaVu Sans", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #8a6508; }
    .note     { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 11.5px; fill: #64748b; }
    .note-sum { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 11.5px; fill: #3f7a5a; }
    .note-raw { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 11.5px; fill: #92700a; }
    .corename { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #ffffff; }
    .corenote { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 11.5px; fill: #cfe3f7; }
    .core-sum { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #bdf0d2; }
    .core-raw { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #fde68a; }
    .head     { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 11.5px; font-weight: 700;
                fill: #94a3b8; letter-spacing: 1.2px; }
    .w-sum    { fill: none; stroke: #2f8f5b; stroke-width: 2; }
    .w-bc     { fill: none; stroke: #7c5cd6; stroke-width: 2; }
    .w-raw    { fill: none; stroke: #d9a406; stroke-width: 2; }
  </style>
  <defs>
    <marker id="m-sum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2f8f5b"/></marker>
    <marker id="m-bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7c5cd6"/></marker>
    <marker id="m-raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d9a406"/></marker>
  </defs>

  <text class="head" x="28"  y="34">WHAT YOU HAVE</text>
  <text class="head" x="308" y="34">CONVERTER</text>
  <text class="head" x="604" y="34">WHAT pycoQC READS</text>
  <text class="head" x="864" y="34">REPORT</text>

  <!-- Bands: one per kind of input, behind the inputs and their converters. -->
  <rect class="band-sum" x="12" y="52"  width="560" height="96"  rx="14"/>
  <rect class="band-bc"  x="12" y="160" width="560" height="232" rx="14"/>
  <rect class="band-raw" x="12" y="404" width="560" height="164" rx="14"/>
  <text class="cat cat-sum" x="28" y="71">BASECALLER SUMMARY</text>
  <text class="cat cat-bc"  x="28" y="179">BASECALLED READS</text>
  <text class="cat cat-raw" x="28" y="423">RAW SIGNAL, NOT BASECALLED</text>

  <!-- The basecaller's own summary needs no conversion. -->
  <rect class="card" x="28" y="80" width="240" height="56" rx="9"/>
  <path class="accent" stroke="#2f8f5b" d="M 30 90 L 30 126"/>
  <text class="name" x="44" y="104">sequencing summary</text>
  <text class="note" x="44" y="122">from Albacore, Guppy or Dorado</text>
  <rect class="pill-none" x="308" y="86" width="240" height="44" rx="22"/>
  <text class="note-sum" x="428" y="112" text-anchor="middle">none needed, read directly</text>

  <!-- Basecalled formats: a converter recomputes the summary from the reads. -->
  <rect class="card" x="28" y="188" width="240" height="56" rx="9"/>
  <path class="accent" stroke="#7c5cd6" d="M 30 198 L 30 234"/>
  <text class="name" x="44" y="212">FASTQ</text>
  <text class="note" x="44" y="230">.fastq / .fq, plain or gzipped</text>
  <rect class="pill" x="308" y="194" width="240" height="44" rx="22"/>
  <text class="name" x="428" y="214" text-anchor="middle">Fastq_to_seq_summary</text>
  <text class="note" x="428" y="230" text-anchor="middle">also gives %GC per read</text>

  <rect class="card" x="28" y="256" width="240" height="56" rx="9"/>
  <path class="accent" stroke="#7c5cd6" d="M 30 266 L 30 302"/>
  <text class="name" x="44" y="280">unaligned BAM</text>
  <text class="note" x="44" y="298">what dorado basecaller writes</text>
  <rect class="pill" x="308" y="262" width="240" height="44" rx="22"/>
  <text class="name" x="428" y="282" text-anchor="middle">Bam_to_seq_summary</text>
  <text class="note" x="428" y="298" text-anchor="middle">also gives %GC per read</text>

  <rect class="card" x="28" y="324" width="240" height="56" rx="9"/>
  <path class="accent" stroke="#7c5cd6" d="M 30 334 L 30 370"/>
  <text class="name" x="44" y="348">FAST5 with basecalls</text>
  <text class="note" x="44" y="366">legacy, Guppy --fast5_out</text>
  <rect class="pill" x="308" y="330" width="240" height="44" rx="22"/>
  <text class="name" x="428" y="350" text-anchor="middle">Fast5_to_seq_summary</text>
  <text class="note" x="428" y="366" text-anchor="middle">reads /Analyses; the slowest</text>

  <!-- Raw signal: no basecalls, so no length and no quality. -->
  <rect class="card" x="28" y="432" width="240" height="56" rx="9"/>
  <path class="accent" stroke="#d9a406" d="M 30 442 L 30 478"/>
  <text class="name" x="44" y="456">POD5</text>
  <text class="note" x="44" y="474">raw signal from MinKNOW</text>
  <rect class="pill" x="308" y="438" width="240" height="44" rx="22"/>
  <text class="name" x="428" y="458" text-anchor="middle">Pod5_to_seq_summary</text>
  <text class="note" x="428" y="474" text-anchor="middle">run metadata only</text>

  <rect class="card" x="28" y="500" width="240" height="56" rx="9"/>
  <path class="accent" stroke="#d9a406" d="M 30 510 L 30 546"/>
  <text class="name" x="44" y="524">FAST5, signal only</text>
  <text class="note" x="44" y="542">no /Analyses group in it</text>
  <rect class="pill" x="308" y="506" width="240" height="44" rx="22"/>
  <text class="name" x="428" y="526" text-anchor="middle">Fast5_to_seq_summary</text>
  <text class="note" x="428" y="542" text-anchor="middle">run metadata only</text>

  <!-- Input -> converter, in the input's colour. -->
  <path class="w-sum" d="M 270 108 L 304 108" marker-end="url(#m-sum)"/>
  <path class="w-bc"  d="M 270 216 L 304 216" marker-end="url(#m-bc)"/>
  <path class="w-bc"  d="M 270 284 L 304 284" marker-end="url(#m-bc)"/>
  <path class="w-bc"  d="M 270 352 L 304 352" marker-end="url(#m-bc)"/>
  <path class="w-raw" d="M 270 460 L 304 460" marker-end="url(#m-raw)"/>
  <path class="w-raw" d="M 270 528 L 304 528" marker-end="url(#m-raw)"/>

  <!-- Converter -> what pycoQC reads, in the colour of the table it gives. -->
  <path class="w-sum" d="M 550 108 L 600 108" marker-end="url(#m-sum)"/>
  <path class="w-sum" d="M 550 216 L 600 216" marker-end="url(#m-sum)"/>
  <path class="w-sum" d="M 550 284 L 600 284" marker-end="url(#m-sum)"/>
  <path class="w-sum" d="M 550 352 L 600 352" marker-end="url(#m-sum)"/>
  <path class="w-raw" d="M 550 460 L 600 460" marker-end="url(#m-raw)"/>
  <path class="w-raw" d="M 550 528 L 600 528" marker-end="url(#m-raw)"/>

  <!-- What pycoQC reads. -->
  <rect class="out-sum" x="604" y="80" width="220" height="300" rx="12"/>
  <text class="name"     x="714" y="198" text-anchor="middle">sequencing_summary.txt</text>
  <text class="label"    x="714" y="226" text-anchor="middle">One summary table</text>
  <text class="note-sum" x="714" y="248" text-anchor="middle">read id, length, quality,</text>
  <text class="note-sum" x="714" y="265" text-anchor="middle">channel, time, barcode,</text>
  <text class="note-sum" x="714" y="282" text-anchor="middle">end reason, mux, duration</text>

  <rect class="out-raw" x="604" y="432" width="220" height="124" rx="12"/>
  <text class="label-raw" x="714" y="463" text-anchor="middle">Run table, no sequence</text>
  <text class="note-raw"  x="714" y="485" text-anchor="middle">which pore and mux, when, how</text>
  <text class="note-raw"  x="714" y="501" text-anchor="middle">long, end reason (POD5), barcode.</text>
  <text class="note-raw"  x="714" y="517" text-anchor="middle">No read length, quality or yield</text>
  <text class="note-raw"  x="714" y="533" text-anchor="middle">until the run is basecalled</text>

  <!-- Both tables go straight across into pycoQC. -->
  <path class="w-sum" d="M 826 230 L 860 230" marker-end="url(#m-sum)"/>
  <path class="w-raw" d="M 826 494 L 860 494" marker-end="url(#m-raw)"/>

  <rect class="core" x="864" y="80" width="120" height="476" rx="14"/>
  <text class="core-sum" x="924" y="226" text-anchor="middle">full report</text>
  <text class="corenote" x="924" y="244" text-anchor="middle">every plot</text>
  <text class="corename" x="924" y="356" text-anchor="middle">pycoQC</text>
  <text class="corenote" x="924" y="378" text-anchor="middle">html · pdf · json</text>
  <text class="core-raw" x="924" y="490" text-anchor="middle">shorter report</text>
  <text class="corenote" x="924" y="508" text-anchor="middle">run plots only</text>
</svg>
