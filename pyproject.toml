[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pycoqc-ng"
dynamic = ["version"]
description = "Interactive QC metrics and plots for Oxford Nanopore sequencing data"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Adrien Leger"},
    {name = "Tommaso Leonardi"},
]
maintainers = [
    {name = "Marc-Olivier Duceppe", email = "duceppemo@gmail.com"},
]
keywords = ["nanopore", "quality control", "sequencing", "dorado", "guppy", "pod5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "plotly>=5.16",
    "jinja2>=3.1",
    "h5py>=3.10",
    "tqdm>=4.66",
    "pysam>=0.22",
    "python-dateutil>=2.8",
    "pod5>=0.2.4",
]

[project.urls]
Homepage = "https://github.com/duceppemo/pycoqc-ng"
Source = "https://github.com/duceppemo/pycoqc-ng"
Issues = "https://github.com/duceppemo/pycoqc-ng/issues"

[project.optional-dependencies]
notebook = ["ipython"]
# Static image export for the PDF report. kaleido drives a headless browser,
# which is why it is not a runtime requirement.
pdf = ["kaleido>=1.0", "pypdf>=4"]
dev = ["pytest>=7", "pytest-cov>=4", "build", "pyflakes>=3"]

[project.scripts]
pycoQC = "pycoQC.__main__:main_pycoQC"
Fast5_to_seq_summary = "pycoQC.__main__:main_Fast5_to_seq_summary"
Fastq_to_seq_summary = "pycoQC.__main__:main_Fastq_to_seq_summary"
Pod5_to_seq_summary = "pycoQC.__main__:main_Pod5_to_seq_summary"
Bam_to_seq_summary = "pycoQC.__main__:main_Bam_to_seq_summary"
Barcode_split = "pycoQC.__main__:main_Barcode_split"

[tool.setuptools]
# templates/ holds data rather than modules, but setuptools treats any
# directory as importable and warns unless it is listed here too. The files
# themselves are shipped by package-data below.
packages = ["pycoQC", "pycoQC.templates"]

[tool.setuptools.dynamic]
version = {attr = "pycoQC.__version__"}

[tool.setuptools.package-data]
pycoQC = ["templates/*", "templates/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:pycoQC.*",
]

[tool.coverage.run]
source = ["pycoQC"]
branch = true
# The converters do their work in worker processes, so without these the
# parsing code reads as uncovered even when the tests exercise it.
parallel = true
concurrency = ["multiprocessing", "thread"]
sigterm = true

[tool.coverage.paths]
# Collapse an installed copy onto the source tree, so coverage measured
# against site-packages in CI maps back to these files.
source = ["pycoQC", "*/site-packages/pycoQC"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
