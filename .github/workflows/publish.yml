name: Publish

# Uploads use PyPI Trusted Publishing (OIDC), so no API token is stored in
# this repository. Each target needs its own publisher registered once:
#
#   https://test.pypi.org/manage/account/publishing/
#   https://pypi.org/manage/account/publishing/
#
#     PyPI project name: pycoqc-ng
#     Owner:             duceppemo
#     Repository:        pycoqc-ng
#     Workflow name:     publish.yml
#     Environment:       testpypi   (on TestPyPI)  /  pypi   (on PyPI)
#
# Rehearse with: Actions -> Publish -> Run workflow -> target: testpypi
# Release for real by publishing a GitHub release, which targets PyPI.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Index to publish to'
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify a clean install from the sdist works outside the repo
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/venv/bin/pycoQC --version
          /tmp/venv/bin/pycoQC --default_config > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Publishing a version that is already there is a no-op rather than
          # a failure: a manual dispatch and a release can both cover one
          # version.
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
